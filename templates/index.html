<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
        <h1 class="text-2xl font-bold text-center mb-6 text-slate-900">QR Generator</h1>
        
        <form id="qrForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">Enter URL</label>
                <input type="url" id="urlInput" required placeholder="https://example.com" 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
            </div>
            
            <div>
                <label class="block text-sm font-semibold mb-1">Error Correction Level</label>
                <select id="ecLevel" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all bg-white">
                    <option value="L">L - Low (7%)</option>
                    <option value="M">M - Medium (15%)</option>
                    <option value="Q">Q - Quartile (25%)</option>
                    <option value="H">H - High (30%)</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors flex justify-center items-center gap-2">
                <span>Generate QR Code</span>
            </button>
        </form>

        <!-- Loading & Result Area -->
        <div id="resultContainer" class="mt-8 hidden flex-col items-center">
            <p id="loadingText" class="text-slate-500 hidden animate-pulse">Generating Matrix...</p>
            <p id="errorText" class="text-red-500 hidden text-sm text-center"></p>
            
            <div id="imageWrapper" class="hidden flex-col items-center gap-4">
                <div class="p-2 border-2 border-slate-100 rounded-xl shadow-sm">
                    <img id="qrImage" src="" alt="Generated QR Code" class="w-48 h-48 object-contain rounded-lg">
                </div>
                <a id="downloadBtn" href="" download="my_qr.png" 
                    class="text-sm font-medium text-blue-600 hover:text-blue-800 underline transition-colors">
                    Download Image
                </a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('qrForm');
        const submitBtn = document.getElementById('submitBtn');
        const resultContainer = document.getElementById('resultContainer');
        const loadingText = document.getElementById('loadingText');
        const errorText = document.getElementById('errorText');
        const imageWrapper = document.getElementById('imageWrapper');
        const qrImage = document.getElementById('qrImage');
        const downloadBtn = document.getElementById('downloadBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI States
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');
            resultContainer.classList.remove('hidden');
            loadingText.classList.remove('hidden');
            errorText.classList.add('hidden');
            imageWrapper.classList.add('hidden');

            const payload = {
                url: document.getElementById('urlInput').value,
                ec_level: document.getElementById('ecLevel').value
            };

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to generate QR code');
                }

                // Convert response to an image URL
                const blob = await response.blob();
                const imageUrl = URL.createObjectURL(blob);
                
                qrImage.src = imageUrl;
                downloadBtn.href = imageUrl;
                
                loadingText.classList.add('hidden');
                imageWrapper.classList.remove('hidden');
                imageWrapper.classList.add('flex');

            } catch (error) {
                loadingText.classList.add('hidden');
                errorText.textContent = error.message;
                errorText.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75');
            }
        });
    </script>
</body>
</html>
